# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
# Keep US spellings that are part of external APIs or established schema and
# command identifiers.
accepted = ["Artifact", "Flavored", "analyzing", "artifact", "color"]

[words.corrections]

[patterns]
# Preserve exact API names, enum values, and function identifiers in inline
# code while keeping Oxford spelling enforced in prose.
ignore = ["`[^`\\n]+`"]

[files]
exclude = []
