name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NIXIE_CLI_VERSION: '1.1.0'
      NIXIE_PYTHON_VERSION: '3.14'
      MERMAN_CLI_VERSION: '0.7.0'
      DAFNY_VERSION: '4.10.0'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          # check-fmt diffs the range back to the merge-base with
          # origin/main, so the full history is required.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: '1.3.14'
      - uses: astral-sh/setup-uv@c5680ec91f7b9b91406fab4ded5d45245abf7b67
        with:
          version: '0.11.19'
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Install Mermaid validators
        run: |
          set -euo pipefail
          cargo install merman-cli --version "=${MERMAN_CLI_VERSION}" --locked
          uv tool install --python "${NIXIE_PYTHON_VERSION}" --managed-python \
            "nixie-cli==${NIXIE_CLI_VERSION}"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          command -v merman-cli
      - name: Install Dafny
        run: |
          set -euo pipefail
          DAFNY_ARCHIVE="${RUNNER_TEMP}/dafny-${DAFNY_VERSION}-x64-ubuntu-20.04.zip"
          DAFNY_ROOT="$(mktemp -d "${RUNNER_TEMP}/dafny-${DAFNY_VERSION}.XXXXXX")"
          curl --fail --location \
            "https://github.com/dafny-lang/dafny/releases/download/v${DAFNY_VERSION}/dafny-${DAFNY_VERSION}-x64-ubuntu-20.04.zip" \
            --output "$DAFNY_ARCHIVE"
          unzip -q "$DAFNY_ARCHIVE" -d "$DAFNY_ROOT"
          echo "$DAFNY_ROOT/dafny" >> "$GITHUB_PATH"
          export PATH="$DAFNY_ROOT/dafny:$PATH"
          command -v dafny
          dafny --version | grep -F "$DAFNY_VERSION"
          test -x "$DAFNY_ROOT/dafny/z3/bin/z3-4.12.1"
          DAFNY_SMOKE="$(mktemp --suffix=.dfy "${RUNNER_TEMP}/dafny-smoke.XXXXXX")"
          trap 'rm -f "$DAFNY_SMOKE"' EXIT
          cat > "$DAFNY_SMOKE" <<'EOF'
          method Main() {
          }
          EOF
          dafny verify "$DAFNY_SMOKE"
          rm -f "$DAFNY_SMOKE"
          trap - EXIT
      - name: Run commit gates
        run: make all
      # make all uses the lenient verify-modules (it skips without Dafny so
      # local runs stay friendly); CI must prove Dafny actually ran.
      - name: Verify decision-table model (strict)
        run: make verify-modules-strict
